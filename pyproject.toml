[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "odop-scanner"
version = "0.1.0"
description = "Local-first ODOP product intelligence scanner for MintLoop"
requires-python = ">=3.12,<3.15"
dependencies = [
  "duckdb>=1.4,<2",
  "jsonschema>=4.25,<5",
  "pytz>=2025.2",
  "pyyaml>=6.0,<7",
  "pypdf>=6,<7",
]

[project.scripts]
odop = "odop_scanner.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
